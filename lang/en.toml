"Tank zwischen 1/4 und 3/4 voll. Kaltstart, danach eine längere Fahrt mit gleichmäßigem Tempo und ein paar Minuten Leerlauf am Ende. Kann mehrere Fahrten dauern." = "Tank between 1/4 and 3/4 full. Cold start, then a longer trip at a steady speed and a few minutes of idling at the end. May take several trips."
"Warm fahren, dann gleichmäßige Fahrt mit einigen Schubphasen." = "Warm up, then drive steadily with a few overrun phases."
"Warm fahren, dann längere gleichmäßige Fahrt auf Landstraße oder Autobahn." = "Warm up, then a longer steady trip on a country road or motorway."
"Zündung zwischendurch nicht nur kurz aus- und wieder einschalten; ein Fahrzyklus = Kaltstart, Fahrt, Motor aus." = "Do not just switch the ignition off and on briefly; one drive cycle = cold start, drive, engine off."
