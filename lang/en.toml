"Ersatzteil-Pass" = "Spare-parts passport"
"Ersatzteil-Pass: {a}" = "Spare-parts passport: {a}"
"Fertig: {a} Steuergeräte, {b} Codierungen, {c} Anpassungswerte." = "Done: {a} control units, {b} codings, {c} adaptation values."
"Geht ein Steuergerät kaputt: ein Teil mit derselben Teilenummer besorgen (die Software ist darauf schon drauf), einbauen und Codierung bzw. Anpassungen wie hier gesichert eintragen. Die vollständigen Daten liegen im Fahrzeugordner von ECUWerkbank (codierung/, anpassungen/, software/). Dieses Blatt zu den Fahrzeugpapieren legen." = "If a control unit fails: get a unit with the same part number (the software is already on it), fit it and enter coding and adaptations as saved here. The full data is in ECUWerkbank's vehicle folder (codierung/, anpassungen/, software/). Keep this sheet with the vehicle documents."
"Hinweis: Der Programmspeicher (die Software) eines Steuergeräts lässt sich über die Diagnose nicht auslesen und wird für einen Tausch nicht gebraucht. Bauteile der Wegfahrsperre (Motor, Kombiinstrument, Schlüssel) müssen nach dem Tausch online angelernt werden." = "Note: a control unit's program memory (the software) cannot be read via diagnostics and is not needed for a replacement. Immobilizer components (engine, instrument cluster, keys) must be adapted online after replacement."
"Komplett-Sicherung fehlgeschlagen: {e}" = "Full backup failed: {e}"
"Komplett-Sicherung fertig: {a} Steuergeräte, {b} Codierungen, {c} Anpassungswerte." = "Full backup done: {a} control units, {b} codings, {c} adaptation values."
"Komplett-Sicherung für {a} über {b} — nur lesen, dauert etwa 10–20 Minuten. Zündung an lassen, Ladegerät an die Batterie." = "Full backup for {a} via {b} — read only, takes about 10–20 minutes. Keep the ignition on, connect a battery charger."
"Sichert von allen Steuergeräten Teilenummer, Softwarestand, Codierung und Anpassungen und erstellt den „Ersatzteil-Pass“ (PDF): welches Teil du kaufen musst und was nach dem Einbau zu tun ist. Nur lesen, dauert etwa 10–20 Minuten. Zündung an, am besten Ladegerät an die Batterie." = "Saves part number, software version, coding and adaptations of all control units and creates the “spare-parts passport” (PDF): which part to buy and what to do after fitting it. Read only, takes about 10–20 minutes. Ignition on, ideally with a battery charger connected."
"Steuergeräte ({a})" = "Control units ({a})"
"TP-2.0-Steuergeräte suchen …" = "Searching TP 2.0 control units …"
"Teil mit gleicher Teilenummer einbauen (Index möglichst gleich), Codierung und Anpassungen wie gesichert eintragen, Fehler löschen." = "Fit a unit with the same part number (same index if possible), enter coding and adaptations as saved, clear faults."
"Wegfahrsperre: Das Teil muss online bei VW (bzw. in einer Werkstatt mit Online-Zugang) angelernt werden, sonst springt das Auto nicht an. Danach Codierung und Anpassungen wie gesichert." = "Immobilizer: the unit must be adapted online with VW (or a workshop with online access), otherwise the car will not start. Then coding and adaptations as saved."
