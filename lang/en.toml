"Braucht einen Kaltstart: Auto mehrere Stunden (am besten über Nacht) abkühlen lassen, starten, 1–2 Minuten im Leerlauf laufen lassen, dann normal losfahren." = "Needs a cold start: let the car cool down for several hours (ideally overnight), start it, idle for 1–2 minutes, then drive off normally."
"Fehler nicht wieder löschen — sonst fangen alle Tests von vorn an." = "Do not clear faults again — otherwise all tests start over."
"Kaltstart bei kaltem Motor (Kühlmittel unter etwa 30 °C) und 2 Minuten Leerlauf — die Pumpe läuft nur kurz nach dem Kaltstart." = "Cold start with a cold engine (coolant below about 30 °C) and 2 minutes of idling — the pump only runs briefly after a cold start."
"Läuft bei jeder Fahrt von selbst mit — einfach normal fahren." = "Runs by itself on every trip — just drive normally."
"Meist sind nach 2–5 normalen Fahrten (Kaltstart, Stadt, Landstraße) alle Tests fertig. Für die AU sollten alle Tests fertig sein." = "Usually all tests are done after 2–5 normal trips (cold start, town, country road). For the emissions test all tests should be done."
"Motor ganz warm fahren, dann 5–10 Minuten möglichst gleichmäßig 60–90 km/h (Landstraße), ohne starkes Gasgeben oder Bremsen." = "Drive until the engine is fully warm, then 5–10 minutes as steady as possible at 60–90 km/h (country road), without hard acceleration or braking."
"Normal fahren, mehrere Fahrten mit Kaltstart und warmem Motor." = "Drive normally, several trips with a cold start and a warm engine."
"Readiness: {a} jetzt fertig" = "Readiness: {a} now done"
"Richtwerte — VW veröffentlicht die genauen Fahrzyklen nicht, sie unterscheiden sich je Motor." = "Guide values — VW does not publish the exact drive cycles, and they differ by engine."
