# Beispiel-Datenpaket für ECUWerkbank: zeigt alles, was ein Datenpaket
# enthalten kann. Die Einträge sind ausgedachte Beispiele, keine echten
# Herstellerdaten.
#
# Übernehmen:  GUI → Werkzeuge → Fahrzeug-Datenbank → Import (mit Vorschau)
#              oder  ecu-werkbank db import beispiele/datenpaket-alles.toml
#
# Wichtig bei TOML: Ein Schlüssel gehört immer zur letzten Überschrift
# ([...] oder [[...]]) darüber. Deshalb stehen die allgemeinen Fehlertexte
# unten als eigene [[fehler]]- und [[fehlerart]]-Blöcke.
#
# Ein zweites Mal übernehmen ersetzt die alte Fassung (gleicher Name unter [quelle]).
#
# Löscht man die Quelle wieder (Fahrzeug-Datenbank → Quellen → 🗑), gelten
# wieder die eingebauten Texte.

# ── Woher die Daten kommen ──────────────────────────────────────────────
[quelle]
name = "Meine Sammlung"          # Pflicht
version = "1"                    # frei wählbar
lizenz = "CC0-1.0"               # leer = bleibt nur bei dir, wird nie exportiert
herkunft = "selbst am Auto ermittelt"

# ── Hersteller ──────────────────────────────────────────────────────────
[[hersteller]]
name = "Volkswagen"
wmi = ["WVW", "WV1", "WV2"]      # erste 3 Zeichen der Fahrgestellnummer

# ── Ein Steuergerät mit allem ───────────────────────────────────────────
[[hersteller.steuergeraet]]
adresse = 0x09                   # Diagnoseadresse (hex 0x.. oder dezimal)
name = "Bordnetz"
gruppe = "Karosserie & Komfort"  # Gruppe in der Steuergeräte-Liste
protokoll = "TP20"               # UDS | TP20 | KWP1281 | OBD
tx = 0x70E                       # CAN-Kennung zum Steuergerät (nur UDS nötig)
rx = 0x778                       # CAN-Kennung der Antwort
teilenummer = "1K0937049"        # Teilenummer: daran erkennt das Programm das Steuergerät am Auto
codier_kennung = 0x0600          # nur nötig, wenn die Codierung woanders steht

# Fehlertexte dieses Steuergeräts
fehler = [
    { code = "01314", text = "Motorsteuergerät: keine Kommunikation" },
    { code = "00532", text = "Versorgungsspannung" },
]

# Messwerte (DIDs): angezeigt wird  Rohwert × faktor + offset
dids = [
    { did = 0xF40C, name = "Motordrehzahl", einheit = "U/min", faktor = 0.25 },
    { did = 0xF405, name = "Kühlmitteltemperatur", einheit = "°C", offset = -40 },
    { did = 0x1234, name = "Batteriespannung", einheit = "V", faktor = 0.1 },
]

# Codierung: Byte und Bit (Bit weglassen = ganzes Byte)
# benoetigt / schliesst_aus: andere Bits als "Byte.Bit"
codierung = [
    { byte = 0, bit = 1, name = "Tagfahrlicht" },
    { byte = 0, bit = 2, name = "Tagfahrlicht über Nebelscheinwerfer", benoetigt = ["0.1"] },
    { byte = 0, bit = 3, name = "Tagfahrlicht über Abblendlicht", schliesst_aus = ["0.2"] },
    { byte = 4, name = "Ländervariante" },
]

# Anpassungskanäle
anpassung = [
    { kanal = 23, name = "Komfortblinken Anzahl" },
    { kanal = 60, name = "Coming Home Dauer" },
]

# Sollwerte: Ampel bei Messwerten. quelle = kwp (Messwertblock, mit Feld),
# uds (Kennung) oder obd (PID); min/max dürfen einzeln fehlen.
sollwert = [
    { quelle = "kwp", id = 7, feld = 2, min = 12.0, max = 14.8, name = "Bordspannung" },
]

# Stellfunktionen (Steuergerät stellt einen Wert selbst ein) stehen als eigene
# Blöcke direkt unter dem Steuergerät, siehe Kombiinstrument unten.

# ── Ein zweites Steuergerät, nur mit dem Nötigsten ──────────────────────
[[hersteller.steuergeraet]]
adresse = 0x17
name = "Kombiinstrument"
teilenummer = "123920000A"   # ausgedacht

[[hersteller.steuergeraet.stellfunktion]]
name = "Beispiel-Stellfunktion"
art = "drehzahl"          # was gestellt wird
tx = 0x714                # Anfrage-ID
rx = 0x77E                # Antwort-ID
id = 0x1234               # Kennung des Sollwerts
min = 0.0
max = 100.0
einheit = "%"

# Service-Rückstellung (Inspektion/Ölwechsel) — nur beim Kombi. Gilt für jedes
# Auto mit dieser Kombi-Teilenummer. Am eigenen Auto lernen: Fahrzeug →
# Service-Anzeige → Vorher/Nachher, dann „In die Fahrzeug-Datenbank übernehmen“.
# reset = ganzer Inhalt der Kennung nach der Rückstellung (Hex); ohne reset
# wird der Wert nur gelesen. Die Kennungen hier sind ausgedacht!
[hersteller.steuergeraet.service]
tx = 0x714
rx = 0x77E
sitzung = 0x03            # 0x03 = erweiterte Sitzung zum Schreiben

[[hersteller.steuergeraet.service.werte]]
art = "km_bis_oelwechsel" # km_bis_inspektion, tage_bis_inspektion, km_bis_oelwechsel,
did = 0x1235              # tage_bis_oelwechsel, km_seit_service, tage_seit_service, sonstiges
laenge = 2
vorzeichen = true         # negativ = überfällig
reset = "3A 98"           # 15000 km

[[hersteller.steuergeraet.service.werte]]
art = "tage_bis_oelwechsel"
did = 0x1236
laenge = 2
vorzeichen = true
reset = "01 6D"           # 365 Tage

# ── Fehlertexte ohne festes Steuergerät (z. B. genormte P-Codes) ────────
[[fehler]]
code = "P0171"
text = "System zu mager (Bank 1)"

[[fehler]]
code = "P0420"
text = "Katalysator Bank 1: Wirkungsgrad zu gering"

# ── Fehlerarten: WAS mit dem Bauteil los ist ────────────────────────────
# Ein Fehler besteht aus Fehlerort (welches Bauteil, oben unter „fehler“)
# und Fehlerart (z. B. „defekt“). Die Nummern hängen vom Protokoll ab:
#   TP20   = ältere Steuergeräte (Golf 6, Polo 6R): Nummer 0–15 aus dem Statusbyte
#   UDS    = neuere Steuergeräte: 3. Byte des Fehlers (z. B. „B1054 13“ → 0x13)
#   KW1281 = sehr alte Autos über K-Line (eigene Nummern, noch nicht genutzt)
# Viele Fehlerarten kennt das Programm schon. Eigene Einträge haben Vorrang,
# z. B. um eine fehlende Nummer zu ergänzen oder einen Text anders zu fassen.

[[fehlerart]]
protokoll = "TP20"
nr = 3
text = "Beispieltext für Fehlerart 3"

[[fehlerart]]
protokoll = "TP20"
nr = 14
text = "Bauteil defekt (austauschen)"

[[fehlerart]]
protokoll = "UDS"
nr = 0x13
text = "Leitung unterbrochen"
