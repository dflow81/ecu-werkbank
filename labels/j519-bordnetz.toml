# J519 — Bordnetzsteuergerät (Adresse 0x09)
#
# LEERES GERÜST zum Selbst-Ausfüllen. Keine Texte aus VCDS übernommen.
# Trage Beschreibungen in DEINEN eigenen Worten ein und die Kanal-/Byte-
# Nummern aus DEINEN eigenen Auslese-Mitschnitten deines Fahrzeugs.
#
# (Die .lbl-Dateien von Ross-Tech bleiben außen vor — deren Texte sind
#  urheberrechtlich geschützt.)

[ecu]
address = 0x09
name = "Bordnetzsteuergerät"      # ggf. anpassen

# --- Messwerte -------------------------------------------------------------
# id = UDS-DID oder KWP-Messwertgruppe; Anzeige = Rohwert * factor + offset
# [[measuring]]
# id = 0x0000
# name = ""                        # deine Beschreibung
# unit = ""
# factor = 1.0
# offset = 0.0

# --- Anpassungskanäle ------------------------------------------------------
# [[adaptation]]
# channel = 0                      # Kanalnummer (aus eigenem Auslesen)
# name = ""                        # deine Beschreibung

# --- Lang-Codierung (byte/bit) ---------------------------------------------
# [[coding]]
# byte = 0                         # Byte-Position
# bit = 0                          # optional: einzelnes Bit (0-7); weglassen = ganzes Byte
# name = ""                        # deine Beschreibung der Funktion

# --- Fehlercodes -----------------------------------------------------------
# [[dtc]]
# code = "B10A9"
# description = ""                 # deine Beschreibung
